<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2a1226"/>
      <stop offset="45%" stop-color="#180b19"/>
      <stop offset="100%" stop-color="#0a040b"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffd3e0" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#f0abc5" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8fb7ff" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Celestial Rose to Cyan Glyph Gradient -->
    <linearGradient id="psiGrad" x1="50" y1="30" x2="105" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#ffd3e0"/>
      <stop offset="65%" stop-color="#f0abc5"/>
      <stop offset="100%" stop-color="#8fb7ff"/>
    </linearGradient>

    <!-- Wave Glow Filter -->
    <filter id="bloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft Core Radial Glow -->
    <radialGradient id="coreGlow" cx="64" cy="64" r="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f0abc5" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#bca4dd" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#150a14" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Squircle Base Frame -->
  <rect width="128" height="128" rx="36" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="126" height="126" rx="35" stroke="url(#borderGrad)" stroke-width="2"/>
  <circle cx="64" cy="64" r="48" fill="url(#coreGlow)"/>

  <!-- Left: Incoming Planar Waves -->
  <path d="M18 42 C23 54 23 74 18 86" stroke="#f0abc5" stroke-opacity="0.35" stroke-width="2" stroke-linecap="round"/>
  <path d="M28 34 C35 52 35 76 28 94" stroke="#f0abc5" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
  <path d="M38 28 C47 50 47 78 38 100" stroke="#ffd3e0" stroke-opacity="0.75" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Double Slit Barrier Wall -->
  <line x1="48" y1="18" x2="48" y2="40" stroke="#f0abc5" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="48" y1="52" x2="48" y2="76" stroke="#ffd3e0" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="48" y1="88" x2="48" y2="110" stroke="#f0abc5" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Glowing Slit Aperture Emitters -->
  <circle cx="48" cy="46" r="2.8" fill="#ffffff" filter="url(#bloom)"/>
  <circle cx="48" cy="82" r="2.8" fill="#ffffff" filter="url(#bloom)"/>

  <!-- Expanding Interference Wavefronts from Slit 1 -->
  <circle cx="48" cy="46" r="16" stroke="#f0abc5" stroke-opacity="0.35" stroke-width="1.6" stroke-dasharray="3 3"/>
  <circle cx="48" cy="46" r="32" stroke="#f0abc5" stroke-opacity="0.28" stroke-width="1.6" stroke-dasharray="4 4"/>
  <circle cx="48" cy="46" r="48" stroke="#f0abc5" stroke-opacity="0.20" stroke-width="1.6" stroke-dasharray="5 5"/>

  <!-- Expanding Interference Wavefronts from Slit 2 -->
  <circle cx="48" cy="82" r="16" stroke="#8fb7ff" stroke-opacity="0.35" stroke-width="1.6" stroke-dasharray="3 3"/>
  <circle cx="48" cy="82" r="32" stroke="#8fb7ff" stroke-opacity="0.28" stroke-width="1.6" stroke-dasharray="4 4"/>
  <circle cx="48" cy="82" r="48" stroke="#8fb7ff" stroke-opacity="0.20" stroke-width="1.6" stroke-dasharray="5 5"/>

  <!-- Interference Overlap Caustic Curves -->
  <path d="M56 36 C70 48 84 56 108 58" stroke="#ffd3e0" stroke-opacity="0.4" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M56 92 C70 80 84 72 108 70" stroke="#8fb7ff" stroke-opacity="0.4" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Central Quantum Psi (ψ) Symbol -->
  <!-- Stem -->
  <line x1="84" y1="34" x2="84" y2="96" stroke="url(#psiGrad)" stroke-width="5" stroke-linecap="round" filter="url(#bloom)"/>
  <!-- Cup Arc -->
  <path d="M68 44 C68 76 100 76 100 44" stroke="url(#psiGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#bloom)"/>
  <!-- Base Horizontal Bar -->
  <line x1="74" y1="96" x2="94" y2="96" stroke="url(#psiGrad)" stroke-width="4.5" stroke-linecap="round" filter="url(#bloom)"/>

  <!-- Celestial 4-Point Sparkle Star ✦ on Top Right -->
  <path d="M106 20 L108.5 25.5 L114 28 L108.5 30.5 L106 36 L103.5 30.5 L98 28 L103.5 25.5 Z" fill="#ffffff" filter="url(#bloom)"/>
  <!-- Tiny Secondary Sparkle -->
  <path d="M60 22 L61 24.5 L63.5 25.5 L61 26.5 L60 29 L59 26.5 L56.5 25.5 L59 24.5 Z" fill="#ffd3e0" opacity="0.85"/>
</svg>
